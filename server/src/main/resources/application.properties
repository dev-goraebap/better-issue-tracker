spring.application.name=bit
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/problem+json,image/svg+xml
server.compression.min-response-size=1KB
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/bit.db}
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
spring.jooq.sql-dialect=SQLITE
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
springdoc.api-docs.path=/api/openapi
springdoc.paths-to-match=/api/v1/**
app.screens=${APP_SCREENS:classpath:/static/}
app.auth.secret=${AUTH_SECRET:}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:8080}
app.auth.attempts-per-minute=${AUTH_ATTEMPTS_PER_MINUTE:10}
app.git.encryption-key=${GIT_ENCRYPTION_KEY:}
# Files (D-029, D-090): S3-compatible storage (AWS S3, Cloudflare R2, MinIO) when STORAGE_ENDPOINT is set, otherwise
# the data volume under STORAGE_LOCAL_ROOT. STORAGE_PUBLIC_ENDPOINT is where browsers reach signed URLs when it
# differs from the endpoint the server uses. R2 takes region auto.
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
app.storage.region=${STORAGE_REGION:auto}
app.storage.bucket=${STORAGE_BUCKET:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.key-prefix=${STORAGE_KEY_PREFIX:}
app.storage.local-root=${STORAGE_LOCAL_ROOT:./data/files}
app.storage.max-file-mb=${STORAGE_MAX_FILE_MB:20}
# Pages (D-113) get Pretendard from the copy BIT's screens ship; the image copies it to /app/page-fonts/.
app.page-fonts=${APP_PAGE_FONTS:file:../client/node_modules/pretendard/dist/web/variable/}
# Daily cleanup of abandoned uploads and discarded files; tests turn it off.
app.jobs.enabled=${APP_JOBS_ENABLED:true}
# Mail (D-027, D-030, BIT-39): set SPRING_MAIL_HOST (with SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
# and the like) to send notices by mail too; MAIL_FROM is the sender, else the SMTP user. No host, no mail.
app.mail.from=${MAIL_FROM:}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
