spring.application.name=bit
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/problem+json,image/svg+xml
server.compression.min-response-size=1KB
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/bit.db}
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
spring.jooq.sql-dialect=SQLITE
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
springdoc.api-docs.path=/api/openapi
springdoc.paths-to-match=/api/v1/**
app.screens=${APP_SCREENS:classpath:/static/}
app.auth.secret=${AUTH_SECRET:}
app.git.encryption-key=${GIT_ENCRYPTION_KEY:}
# No mail adapter is configured in the bootstrap. An absent SMTP host creates no sender.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
