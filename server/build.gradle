plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'com.github.spotbugs' version '6.5.9'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.6'
}

group = 'io.github.goraebap'
version = '0.19.1'
ext['jooq.version'] = '3.21.6'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.xerial:sqlite-jdbc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    // MCP for agents (D-022, D-081): the official Java SDK's stateless Streamable HTTP servlet, on Jackson 3.
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.1.0'
    // Files on S3, Cloudflare R2 or MinIO through one adapter (D-029); without STORAGE_ENDPOINT they stay local.
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') { archiveFileName = 'app.jar' }
// Tests keep their local file storage under build/ and run no nightly jobs.
tasks.withType(Test).configureEach {
    systemProperty 'app.storage.local-root', layout.buildDirectory.dir('test-files').get().asFile.absolutePath
    systemProperty 'app.jobs.enabled', 'false'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'integration' }
    testLogging { events 'failed'; exceptionFormat 'full'; showStackTraces = true }
}

jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                properties {
                    property { key = 'scripts'; value = 'src/main/resources/db/migration/*.sql' }
                    property { key = 'sort'; value = 'flyway' }
                    property { key = 'defaultNameCase'; value = 'lower' }
                    property { key = 'unqualifiedSchema'; value = 'public' }
                    property { key = 'parseIgnoreComments'; value = 'true' }
                }
                schemata {
                    schema { inputSchema = 'PUBLIC'; outputSchemaToDefault = true }
                }
                forcedTypes {
                    // SQLite REAL stores doubles; DDLDatabase otherwise maps SQL REAL to Java Float.
                    forcedType {
                        name = 'DOUBLE'
                        includeExpression = '(?i:.*(work_item|work_item_view)\\.position)'
                    }
                    // Ids are ten-character text (D-083); the columns V1-V8 declared uuid keep that type name in SQLite.
                    forcedType {
                        name = 'VARCHAR'
                        includeTypes = 'UUID'
                    }
                    forcedType {
                        userType = 'java.time.Instant'
                        binding = 'io.github.goraebap.bit.shared.persistence.InstantTextBinding'
                        includeTypes = 'TIMESTAMP.*WITH.*TIME.*ZONE'
                    }
                }
            }
            target {
                packageName = 'io.github.goraebap.bit.jooq'
                directory = layout.buildDirectory.dir('generated-sources/jooq').get().asFile.absolutePath
            }
        }
    }
}
tasks.named('jooqCodegen') { inputs.files(fileTree('src/main/resources/db/migration')) }
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated-sources/jooq')
tasks.named('compileJava') { dependsOn tasks.named('jooqCodegen') }

spotless {
    java {
        target fileTree('src') { include '**/*.java' }
        palantirJavaFormat()
        removeUnusedImports()
        formatAnnotations()
    }
}
checkstyle { toolVersion = '13.8.0'; maxWarnings = 0 }
tasks.withType(Checkstyle).configureEach { exclude '**/jooq/**' }
spotbugs { excludeFilter = file('config/spotbugs/exclude.xml') }
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports { html { required = true }; xml { required = true } }
}
tasks.register('exportOpenApi', Test) {
    description = 'Exports the HTTP contract without a database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'io.github.goraebap.bit.OpenApiContractTest' }
    systemProperty 'exportOpenApi', 'true'
    outputs.upToDateWhen { false }
}
tasks.register('integrationTest', Test) {
    description = 'Verifies migrations and HTTP against an isolated SQLite file.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter tasks.named('test')
}
tasks.named('check') { dependsOn tasks.named('integrationTest') }
