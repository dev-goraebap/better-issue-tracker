name: bit-prod
services:
  app:
    image: ${BIT_IMAGE:-bit:prod}
    ports:
      - "${BIT_BIND_ADDRESS:-127.0.0.1}:${BIT_PORT:-8080}:8080"
    volumes:
      - bit-data:/var/lib/bit
    environment:
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      AUTH_ALLOWED_ORIGINS: "${AUTH_ALLOWED_ORIGINS:?Set the public application origin, e.g. https://bit.example.com}"
      # Files (D-029, D-090). Left empty, files stay in the data volume (/var/lib/bit/files). Set STORAGE_ENDPOINT,
      # STORAGE_BUCKET and the key pair for S3, Cloudflare R2 (https://<account>.r2.cloudflarestorage.com, region
      # auto) or MinIO; the bucket needs CORS allowing PUT from AUTH_ALLOWED_ORIGINS. If the storage does not answer
      # at start, files turn off; Settings > Server features shows why.
      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-}"
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-}"
      STORAGE_REGION: "${STORAGE_REGION:-auto}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-}"
      STORAGE_KEY_PREFIX: "${STORAGE_KEY_PREFIX:-}"
      STORAGE_MAX_FILE_MB: "${STORAGE_MAX_FILE_MB:-20}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Optional: docker compose --profile backup up -d (configure the replica first).
  litestream:
    image: litestream/litestream:0.5.17
    profiles: [backup]
    depends_on:
      app:
        condition: service_healthy
    user: "10001:10001"
    command: [replicate, -config, /etc/litestream.yml]
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      AWS_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - bit-data:/var/lib/bit
      - ./litestream.yml:/etc/litestream.yml:ro
    stop_grace_period: 30s
volumes:
  bit-data:
